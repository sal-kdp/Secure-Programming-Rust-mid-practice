<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rust Writing Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a workbench. Sticky header with sections + language; skill sheets read top to bottom (form → points → mistakes → practice); programs are a task card beside a help drawer. */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --sunk:#E2E5E8; --ink:#14171B; --muted:#58616A; --line:#D2D7DC;
  --oxide:#A9461A; --oxide-soft:#F6E3D8; --patina:#23736A; --patina-soft:#DDF0EC; --bad:#B42318; --bad-soft:#FBE4E1;
  --code-bg:#1A1D21; --code-fg:#E6E8EA; --k:#F0915A; --s:#9CD3A5; --c:#7D8790; --n:#E9C46A; --m:#8EC5F0;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --ink:#E8EAEC; --muted:#9AA3AC; --line:#2E3338;
  --oxide:#E5814F; --oxide-soft:#3A2419; --patina:#5DB8AB; --patina-soft:#16302C; --bad:#F2796B; --bad-soft:#3A1C19; --code-bg:#0B0D0F; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --sunk:#23272B; --ink:#E8EAEC; --muted:#9AA3AC; --line:#2E3338;
  --oxide:#E5814F; --oxide-soft:#3A2419; --patina:#5DB8AB; --patina-soft:#16302C; --bad:#F2796B; --bad-soft:#3A1C19; --code-bg:#0B0D0F; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15.5px; line-height:1.6}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
.wrap{max-width:960px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
header.top{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:env(safe-area-inset-top,0px); z-index:5}
.brand{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding-block:12px 6px}
.brand h1{font-family:var(--display); font-stretch:112%; font-weight:800; font-size:1.3rem; margin:0}
.brand h1 b{color:var(--oxide)}
nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--display); font-weight:600; font-size:.92rem; border:0; background:none; color:var(--muted); padding:9px 12px 10px; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--oxide)}
.tab small{font-family:var(--body); font-weight:500; margin-left:6px; color:var(--muted)}
:focus-visible{outline:2px solid var(--oxide); outline-offset:2px}
.seg{display:inline-flex; flex-wrap:wrap; background:var(--sunk); border-radius:8px; padding:3px; gap:2px}
.seg button{border:0; background:none; color:var(--muted); font:600 .85rem var(--body); padding:5px 11px; border-radius:6px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:22px 72px}
.head{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.eyebrow{font-family:var(--mono); font-size:.74rem; text-transform:uppercase; letter-spacing:.08em; color:var(--oxide)}
h2{font-family:var(--display); font-stretch:115%; font-weight:800; font-size:clamp(1.5rem,4vw,2.2rem); line-height:1.12; margin:2px 0 0; text-wrap:balance}
.sub{color:var(--muted)}
h3.sec{font-family:var(--display); font-weight:700; font-size:.82rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:26px 0 10px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
h3.sec .ar{text-transform:none; letter-spacing:0; font-family:var(--body)}
.only-en .ar, .only-en .ar-inline{display:none!important} .only-ar .en{display:none!important}
.ar, .ar-block{direction:rtl; text-align:right}
code{font-family:var(--mono); font-size:.86em; background:var(--sunk); padding:1px 5px; border-radius:4px; direction:ltr; unicode-bidi:isolate}
pre.code{background:var(--code-bg); color:var(--code-fg); font-family:var(--mono); font-size:.84rem; line-height:1.55; padding:12px 14px; border-radius:8px; overflow-x:auto; margin:0; direction:ltr; text-align:left}
pre.code code{background:none; padding:0; font-size:inherit; white-space:pre; color:inherit}
.tk-k{color:var(--k)} .tk-s{color:var(--s)} .tk-c{color:var(--c); font-style:italic} .tk-n{color:var(--n)} .tk-m{color:var(--m)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px}
.btn{font:600 .92rem var(--body); border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 16px; border-radius:8px; cursor:pointer}
.btn:hover{border-color:var(--muted)} .btn.primary{background:var(--oxide); border-color:var(--oxide); color:#fff} .btn.small{padding:5px 11px; font-size:.84rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px}
.chip{font-family:var(--mono); font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; padding:2px 7px; border-radius:4px; background:var(--sunk); color:var(--muted); white-space:nowrap}
.chip.ok{background:var(--patina-soft); color:var(--patina)} .chip.warn{background:var(--oxide-soft); color:var(--oxide)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
/* Skills index */
.grp{margin-bottom:22px}
.grp-h{font-family:var(--display); font-weight:800; font-stretch:110%; font-size:1.05rem; margin:0 0 8px; display:flex; gap:10px; align-items:baseline}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
.tile{display:flex; flex-direction:column; gap:6px; text-align:left; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; cursor:pointer; min-width:0}
.tile:hover{border-color:var(--oxide)}
.tile b{font-family:var(--display); font-weight:700; font-size:1rem; line-height:1.3}
.tile .ar{color:var(--muted); font-size:.92rem}
.meter{height:4px; background:var(--sunk); border-radius:2px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--patina)}
/* Skill page */
.pairs{display:grid; gap:6px}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:4px 22px; padding:7px 0; border-top:1px dashed var(--line)}
.pair:first-child{border-top:0}
.pair > div{min-width:0}
.only-en .pair, .only-ar .pair{grid-template-columns:1fr}
.tbl-wrap{overflow-x:auto; margin-top:12px}
table{border-collapse:collapse; width:100%; font-size:.9rem; min-width:520px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--display); font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
td.ar{text-align:right}
.mist{display:grid; gap:10px}
.mcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.mcard .row{display:grid; grid-template-columns:1fr 1fr; gap:0}
.mcard .side{padding:10px 12px; min-width:0}
.mcard .side + .side{border-left:1px solid var(--line)}
.mcard .lbl{font-family:var(--mono); font-size:.7rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; display:block}
.mcard .bad .lbl{color:var(--bad)} .mcard .good .lbl{color:var(--patina)}
.mcard pre.code{font-size:.8rem; padding:9px 11px}
.mcard .why{padding:9px 12px; background:var(--sunk); font-size:.92rem; display:grid; gap:2px}
.errname{font-family:var(--mono); font-size:.82rem; color:var(--bad); font-weight:600}
.pager{display:flex; justify-content:space-between; gap:10px; margin-top:28px; flex-wrap:wrap}
/* Practice */
.items{display:grid; gap:12px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px}
.item.done-ok{border-color:var(--patina)}
.item .q{font-weight:500; margin:6px 0 2px}
.item .qa{color:var(--muted); margin:0 0 10px}
textarea.code-in{width:100%; min-height:90px; font-family:var(--mono); font-size:.86rem; line-height:1.55; color:var(--code-fg); background:var(--code-bg); border:1.5px solid transparent; border-radius:8px; padding:10px 12px; resize:vertical; tab-size:4; direction:ltr}
textarea.code-in:focus{outline:none; border-color:var(--oxide)}
input.blank{font-family:var(--mono); font-size:.84rem; min-width:5ch; padding:1px 6px; background:#2A2F35; color:#fff; border:1px solid #5A626B; border-radius:4px}
input.blank.right{border-color:#5DB8AB; background:rgba(93,184,171,.25)} input.blank.wrong{border-color:#F2796B; background:rgba(242,121,107,.25)}
.opts{display:grid; gap:8px}
.opt{text-align:left; font:inherit; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 12px; border-radius:8px; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--oxide)}
.opt.right{border-color:var(--patina); background:var(--patina-soft)} .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px; border-radius:8px; padding:11px 13px; background:var(--sunk); display:grid; gap:6px}
.fb.ok{background:var(--patina-soft)} .fb.no{background:var(--bad-soft)}
.fb .v{font-family:var(--display); font-weight:800}
.fb.ok .v{color:var(--patina)} .fb.no .v{color:var(--bad)}
/* Parsons */
.parsons{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pane{min-width:0}
.pane-h{font-family:var(--display); font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:6px}
.plist{background:var(--code-bg); border-radius:8px; padding:6px; min-height:60px; display:flex; flex-direction:column; gap:3px; overflow-x:auto}
.pline{display:block; width:100%; min-width:max-content; text-align:left; font-family:var(--mono); font-size:.8rem; line-height:1.45; color:var(--code-fg); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:5px; padding:4px 8px; cursor:pointer; white-space:pre}
.pline:hover{border-color:#E5814F}
.pline.right{border-color:#5DB8AB; background:rgba(93,184,171,.2)} .pline.wrong{border-color:#F2796B; background:rgba(242,121,107,.2)}
.empty{color:#7D8790; font-size:.8rem; padding:8px; font-family:var(--body)}
@media (max-width:700px){ .parsons{grid-template-columns:1fr} .pair{grid-template-columns:1fr} .mcard .row{grid-template-columns:1fr} .mcard .side + .side{border-left:0; border-top:1px solid var(--line)} }
/* Programs */
.lvl-h{display:flex; gap:10px; align-items:baseline; margin:20px 0 8px}
.lvl-h b{font-family:var(--display); font-weight:800; font-stretch:110%}
.prog-list{display:grid; gap:8px}
.prog{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; text-align:left; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 14px; cursor:pointer}
.prog:hover{border-color:var(--oxide)}
.prog b{font-family:var(--display); font-weight:700}
.prog .ar{color:var(--muted); font-size:.92rem}
.task{font-size:1.04rem}
.io{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
.io > div{min-width:0}
@media (max-width:700px){ .io{grid-template-columns:1fr} }
details.help{background:var(--surface); border:1px solid var(--oxide); border-radius:12px; margin-top:14px}
details.help > summary{cursor:pointer; padding:12px 16px; font-family:var(--display); font-weight:800; color:var(--oxide); list-style:none; display:flex; gap:10px; align-items:baseline}
details.help > summary::-webkit-details-marker{display:none}
details.help > summary::before{content:"+"; font-family:var(--mono)}
details.help[open] > summary::before{content:"−"}
.help-body{padding:0 16px 16px; display:grid; gap:16px}
.hint-list{margin:0; padding-left:1.4em; display:grid; gap:6px}
.hint-list li{padding-left:4px}
.formbox summary{cursor:pointer; font-weight:600; padding:4px 0}
.steps{counter-reset:s; list-style:none; padding:0; margin:0; display:grid; gap:10px}
.steps li{counter-increment:s; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px 12px 52px; position:relative}
.steps li::before{content:counter(s); position:absolute; left:14px; top:12px; width:26px; height:26px; border-radius:50%; background:var(--oxide); color:#fff; font-family:var(--mono); font-weight:600; font-size:.85rem; display:grid; place-items:center}
input.search{font:inherit; width:100%; max-width:420px; padding:8px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Rust <b>Writing</b> Trainer</h1>
    <div class="seg" role="group" aria-label="Language"><button data-lang="both">EN+ع</button><button data-lang="en">EN</button><button data-lang="ar">ع</button></div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main class="wrap" id="main"></main>

<script>
/* Writing skills. Practice item types:
   write: type code; checked by whitespace-free compare against `accept` or regex `re`.
   fix:   edit `start` code; same checking.
   fill:  blanks ___ in `code`.
   order: tap lines into the right order (`lines` is the correct order).
   mcq:   pick the right form.
   `test` = harness used only to compile-check the answer ({{A}} is replaced). */
const SKILLS = [
/* ========================= CH 1–2 ========================= */
{ id:"print", ch:"Ch 1–2", t:"Program skeleton & printing", ar:"هيكل البرنامج والطباعة",
  form:`fn main() {
    println!("text");                 // print + new line
    println!("x = {}", x);            // {} filled in order
    println!("x = {x}");              // variable name inside {}
    println!("sum = {}", a + b);      // expressions need empty {}
    print!("no new line ");
    println!();                       // just a new line
}`,
  points:[
   ["Every program starts at `fn main() { }`.","كل برنامج يبدأ من `fn main() { }`."],
   ["`println!` has `!` because it is a macro. Each statement ends with `;`.","`println!` فيها `!` لأنها ماكرو، وكل جملة تنتهي بـ `;`."],
   ["Only a plain variable name can go inside `{}`. For `a + b` use `{}` and put the expression after the comma.","داخل `{}` تقدر تكتب اسم متغير بس. أما `a + b` فتكتب `{}` وتحط التعبير بعد الفاصلة."]
  ],
  pitfalls:[
   { bad:`println!("{} {}", x);`, err:"2 positional arguments in format string, but there is 1 argument", fix:`println!("{} {}", x, y);`, en:"Count the `{}`: each one needs an argument.", ar:"عدّ الأقواس `{}`، كل واحد يحتاج قيمة." },
   { bad:`println!("{x + 1}");`, err:"invalid format string", fix:`println!("{}", x + 1);`, en:"Expressions can't go inside the braces.", ar:"التعابير ما تنكتب داخل الأقواس." },
   { bad:`println("hi");`, err:"expected function, found macro `println`", fix:`println!("hi");`, en:"Don't forget the `!`.", ar:"لا تنسى علامة `!`." }
  ],
  practice:[
   { type:"write", q:"`a` and `b` already exist (7 and 8). Write ONE line that prints `Total: 15` using `{}` and the expression `a + b`.", qa:"اكتب سطر واحد يطبع `Total: 15` باستخدام `{}` والتعبير `a + b`.",
     accept:[`println!("Total: {}", a + b);`], test:`fn main() { let a = 7; let b = 8; {{A}} }`,
     en:"The expression goes after the comma.", ar:"التعبير يجي بعد الفاصلة." },
   { type:"write", q:"`name` holds \"Sara\". Print `Hi Sara` by putting the variable name inside the braces.", qa:"اطبع `Hi Sara` بكتابة اسم المتغير داخل الأقواس.",
     accept:[`println!("Hi {name}");`, `println!("Hi {}", name);`], test:`fn main() { let name = "Sara"; {{A}} }`,
     en:"`{name}` prints the variable directly.", ar:"`{name}` تطبع المتغير مباشرة." },
   { type:"order", q:"Put the lines in order to make a complete program.", qa:"رتّب الأسطر عشان يصير برنامج كامل.",
     lines:[`fn main() {`, `    let lang = "Rust";`, `    println!("Hello, {lang}!");`, `}`],
     en:"Declare before you use.", ar:"عرّف المتغير قبل ما تستخدمه." },
   { type:"mcq", q:"Which code prints `1 2` on ONE line?", qa:"أي كود يطبع `1 2` في سطر واحد؟",
     options:[`print!("1 "); println!("2");`, `println!("1 "); println!("2");`, `println!("1", "2");`, `print("1 2");`], answer:0,
     en:"`print!` doesn't add a new line; `println!` does.", ar:"`print!` ما تضيف سطر جديد، و `println!` تضيف." }
  ]},
{ id:"vars", ch:"Ch 1–3", t:"Variables, mut, shadowing, const", ar:"المتغيرات و mut و shadowing و const",
  form:`let name = value;              // immutable
let mut name = value;          // can change later
let name: Type = value;        // with a type annotation
let name = name + 1;           // shadowing: a NEW variable, type may change
const NAME: Type = value;      // constant: type required, UPPER_CASE, never mut`,
  points:[
   ["Will it change later? → `let mut`. Changing type? → shadow with `let`.","بيتغير بعدين؟ ← `let mut`. بيتغير نوعه؟ ← shadow بـ `let`."],
   ["`x += 1` means `x = x + 1` (needs `mut`).","`x += 1` تعني `x = x + 1` وتحتاج `mut`."]
  ],
  pitfalls:[
   { bad:`let x = 5;\nx = 6;`, err:"cannot assign twice to immutable variable `x`", fix:`let mut x = 5;\nx = 6;`, en:"Add `mut` when you assign again.", ar:"ضيف `mut` إذا بتعطيه قيمة ثانية." },
   { bad:`const MAX = 10;`, err:"missing type for `const` item", fix:`const MAX: u32 = 10;`, en:"Constants always need a type.", ar:"الثابت لازم له نوع." },
   { bad:`let mut s = "abc";\ns = s.len();`, err:"mismatched types", fix:`let s = "abc";\nlet s = s.len();`, en:"`mut` can't change the type. Shadow instead.", ar:"`mut` ما يغيّر النوع، استخدم shadowing." }
  ],
  practice:[
   { type:"write", q:"Declare a mutable variable `count` starting at 0, then add 1 to it (two lines).", qa:"عرّف متغير `count` قابل للتعديل يبدأ من 0، وبعدين زِد عليه 1.",
     re:[`letmutcount(:i32|:u32)?=0;count(\\+=1|=count\\+1);`], accept:[`let mut count = 0;\ncount += 1;`], test:`fn main() { {{A}} println!("{count}"); }`,
     en:"`let mut` then `+= 1`.", ar:"`let mut` وبعدين `+= 1`." },
   { type:"write", q:"Declare a constant `MAX_SCORE` of type `u32` with value 100.", qa:"عرّف ثابت `MAX_SCORE` نوعه `u32` وقيمته 100.",
     accept:[`const MAX_SCORE: u32 = 100;`], test:`{{A}}\nfn main() { println!("{MAX_SCORE}"); }`,
     en:"`const`, name, colon, type, value.", ar:"`const` ثم الاسم ثم النوع ثم القيمة." },
   { type:"fix", q:"Fix the code so it compiles and prints 15.", qa:"صحّح الكود عشان يترجم ويطبع 15.",
     start:`let total = 10;\ntotal = total + 5;\nprintln!("{total}");`,
     accept:[`let mut total = 10;\ntotal = total + 5;\nprintln!("{total}");`, `let total = 10;\nlet total = total + 5;\nprintln!("{total}");`], test:`fn main() { {{A}} }`,
     en:"Either `let mut total` or shadow with `let total = total + 5;`.", ar:"إما `let mut` أو shadow بـ `let`." },
   { type:"write", q:"`input` is the &str \"42\". Shadow it into a `u32` also called `input`, using `parse` and `expect`.", qa:"سوّ shadow لـ `input` وحوّله إلى `u32` بـ parse و expect.",
     re:[`letinput:u32=input(\\.trim\\(\\))?\\.parse\\(\\)\\.expect\\(".*"\\);`], accept:[`let input: u32 = input.trim().parse().expect("Not a number");`], test:`fn main() { let input = "42"; {{A}} println!("{}", input + 1); }`,
     en:"The type annotation `: u32` tells parse what to produce.", ar:"`: u32` تحدد لـ parse النوع المطلوب." }
  ]},
{ id:"input", ch:"Ch 2", t:"Reading user input", ar:"قراءة مدخلات المستخدم",
  form:`use std::io;                                   // at the top of the file

let mut input = String::new();                 // must be mut
io::stdin()

  arTask:"struct للمنتج مع new و value و sell و restock، ودالة summary ترجع tuple (إجمالي الكمية، إجمالي القيمة). جرّب بيع وإعادة تعبئة واطبع كل شي.",
  output:"sell 3 Pen: true\nsell 50 Book: false\nPen x7 = 17.5\nBook x4 = 48\nBag x7 = 210\nTotal: 18 items, 275.5",
  hints:["Write the struct and `new` (String::from(name), shorthand for the rest).","value: `self.price * self.qty as f64`. sell: `if n > self.qty { return false; }` then subtract, `true`.","summary: two totals, `for it in items`, return `(q, v)`.","main: `let mut items = [...]`; call `items[0].sell(3)`; loop `for it in &items`; `let (q, v) = summary(&items);`"],
  arHints:["struct و new أول.","value و sell (ارجع false إذا الكمية ما تكفي).","summary: مجموعين وحلقة وترجع tuple.","main: `let mut items` واستدعِ الدوال وفكّك الـ tuple."],
  forms:["struct","impl","slice","tuple"], mistakes:[["`let items = [..]` without mut, then `items[0].sell(3)`.","`items` بدون mut."],["Subtracting before checking (u32 can't go below 0 → panic).","تطرح قبل ما تتحقق."],["`for it in items` moves the array before `summary(&items)`.","`for it in items` ينقل المصفوفة."]],
  model:`struct Item {
    name: String,
    qty: u32,
    price: f64,
}

impl Item {
    fn new(name: &str, qty: u32, price: f64) -> Self {
        Self {
            name: String::from(name),
            qty,
            price,
        }
    }

    fn value(&self) -> f64 {
        self.price * self.qty as f64
    }

    fn sell(&mut self, n: u32) -> bool {
        if n > self.qty {

        self.qty -= n;

    }

        total_value += it.value();
    }

  arTask:"لعبة التخمين لكن بـ struct: Game فيه الرقم السري وعدد المحاولات، و check ترجع Ordering.",
  output:"Too big!\nToo small!\nYou win in 3 tries!",
  hints:["`use std::cmp::Ordering;` and `use std::io;` at the top.","check: `self.tries += 1; guess.cmp(&self.secret)` (needs `&mut self`).","main: `let mut game = Game::new(42);` then `loop` with read_line and match on parse.","`match game.check(guess) { Ordering::Equal => { println!(..., game.tries); break; } ... }`"],
  arHints:["سطري use فوق.","check تزيد tries وترجع cmp، وتحتاج &mut self.","main: `let mut game` ثم loop وقراءة وتحويل.","match على `game.check(guess)` ومع Equal اطبع واطلع."],
  forms:["impl","input","loop"], mistakes:[["`fn check(&self, ..)` → cannot assign to `self.tries`.","`&self` بدل `&mut self`."],["Missing an Ordering arm → non-exhaustive patterns.","نسيان حالة من Ordering."]],
  model:`use std::cmp::Ordering;
use std::io;

struct Game {
    secret: u32,
    tries: u32,
}

impl Game {
    fn new(secret: u32) -> Self {
        Self { secret, tries: 0 }
    }

    fn check(&mut self, guess: u32) -> Ordering {
        self.tries += 1;
        guess.cmp(&self.secret)
    }
}

fn main() {
    let mut game = Game::new(42);
    loop {
        let mut input = String::new();
        io::stdin()
            .read_line(&mut input)
            .expect("Failed to read line");
        let guess: u32 = match input.trim().parse() {
            Ok(num) => num,
            Err(_) => continue,
        };
        match game.check(guess) {
            Ordering::Less => println!("Too small!"),
            Ordering::Greater => println!("Too big!"),
            Ordering::Equal => {
                println!("You win in {} tries!", game.tries);
                break;
            }
        }
    }
}` }
];
const STEPS = [
 ["Read the task and list the data. Names → struct. 2–3 mixed values → tuple. Many values of one type → array.","اقرأ السؤال وحدد البيانات: لها أسماء ← struct، قيمتين أو ثلاث مختلفة ← tuple، قيم كثيرة من نوع واحد ← array."],

</script>
<script>
(function(){
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const inl = s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
const KW=/^(fn|let|mut|const|if|else|loop|while|for|in|break|continue|return|match|struct|impl|use|self|Self|true|false|as)$/;
const TY=/^(i8|i16|i32|i64|u8|u16|u32|u64|usize|f32|f64|bool|char|str|String|Result|Ok|Err|Ordering)$/;
function hl(src){
  const re=/(\/\/[^\n]*)|("(?:\\.|[^"\\])*")|(b?'(?:\\.|[^'\\])'(?!\w))|('[a-z_]+)|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*!?)|(#\[[^\]]*\])/g;
  let o="",last=0,m;
  while((m=re.exec(src))){ o+=esc(src.slice(last,m.index)); last=re.lastIndex; const t=m[0];
    if(m[1]||m[7]) o+=`<span class="tk-c">${esc(t)}</span>`;
    else if(m[2]||m[3]) o+=`<span class="tk-s">${esc(t)}</span>`;
    else if(m[4]) o+=`<span class="tk-m">${esc(t)}</span>`;
    else if(m[5]) o+=`<span class="tk-n">${esc(t)}</span>`;
    else if(t.endsWith("!")) o+=`<span class="tk-m">${esc(t)}</span>`;
    else if(KW.test(t)) o+=`<span class="tk-k">${esc(t)}</span>`;
    else if(TY.test(t)) o+=`<span class="tk-n">${esc(t)}</span>`;
    else o+=esc(t); }
  return o+esc(src.slice(last));
}
const code = s=>`<pre class="code"><code>${hl(s)}</code></pre>`;
const store={ get(k,d){ try{ const v=localStorage.getItem("rwt:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{ localStorage.setItem("rwt:"+k,JSON.stringify(v)); }catch(e){} } };
const norm = s=>String(s).replace(/\/\/[^\n]*/g,"").replace(/\s+/g,"").replace(/,([}\)\]])/g,"$1");
function matches(item, val){
  const x = norm(val);
  if((item.accept||[]).some(a=>{ const n=norm(a); return n===x || n.replace(/;$/,"")===x.replace(/;$/,""); })) return true;
  return (item.re||[]).some(r=>{ const R=new RegExp("^"+r+"$"); return R.test(x)||R.test(x+";")||R.test(x.replace(/;$/,"")); });
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const bi = (en, ar)=> `<span class="en">${inl(en)}</span>${ar?` <span class="ar ar-inline" dir="rtl" style="display:block">${inl(ar)}</span>`:""}`;

/* smart textarea: Tab = 4 spaces, Enter keeps indentation (+4 after {) */
function smart(ta){
  ta.addEventListener("keydown", e=>{
    const s=ta.selectionStart, v=ta.value;
    if(e.key==="}"){ const ls=v.lastIndexOf("\n", s-1)+1, before=v.slice(ls, s);
      if(/^ {4,}$/.test(before) && s===ta.selectionEnd){ e.preventDefault(); ta.setRangeText(before.slice(4)+"}", ls, s, "end"); ta.dispatchEvent(new Event("input")); return; } }
    if(e.key==="Tab"){ e.preventDefault(); ta.setRangeText("    ", s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
    if(e.key==="Enter"){ const lineStart=v.lastIndexOf("\n", s-1)+1, line=v.slice(lineStart, s); let ind=(line.match(/^ */)||[""])[0];
      if(/\{\s*$/.test(line)) ind+="    "; e.preventDefault(); ta.setRangeText("\n"+ind, s, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  });
}

/* ---------- state ---------- */
const VIEWS=[["skills","Skills","المهارات"],["programs","Programs","البرامج"],["mistakes","Mistakes","الأخطاء"],["howto","How to write","طريقة الكتابة"]];
let st = { view: store.get("view","skills"), skill:null, prog:null, lang: store.get("lang","both") };
if(!VIEWS.some(v=>v[0]===st.view)) st.view="skills";
function setLang(){ document.body.classList.toggle("only-en", st.lang==="en"); document.body.classList.toggle("only-ar", st.lang==="ar");
  document.querySelectorAll("[data-lang]").forEach(b=> b.setAttribute("aria-pressed", b.dataset.lang===st.lang)); }
document.querySelectorAll("[data-lang]").forEach(b=> b.onclick=()=>{ st.lang=b.dataset.lang; store.set("lang",st.lang); setLang(); });

function tabs(){
  $("#tabs").innerHTML = VIEWS.map(v=>`<button class="tab" role="tab" aria-selected="${v[0]===st.view}" data-v="${v[0]}">${v[1]}<small>${v[2]}</small></button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=> b.onclick=()=>{ st.view=b.dataset.v; st.skill=null; st.prog=null; store.set("view",st.view); render(); scrollTo({top:0}); });
}
function render(){ tabs(); setLang();
  if(st.view==="skills") return st.skill!=null ? skillPage(st.skill) : skillsIndex();
  if(st.view==="programs") return st.prog!=null ? progPage(st.prog) : progIndex();

}

/* ---------- Skills ---------- */
const itemKey=(s,i)=>`item:${SKILLS[s].id}:${i}`;
function skillDone(s){ return SKILLS[s].practice.filter((_,i)=> store.get(itemKey(s,i),{}).ok).length; }
function skillsIndex(){
  const groups=[...new Set(SKILLS.map(s=>s.ch))];
  const total=SKILLS.reduce((a,s)=>a+s.practice.length,0), done=SKILLS.reduce((a,_,i)=>a+skillDone(i),0);
  $("#main").innerHTML = `<div class="head"><div><div class="eyebrow">Part 1 · ${done} / ${total} exercises solved</div><h2>Writing skills, one form at a time</h2>
    <div class="sub ar" dir="rtl">المهارات الأساسية: لكل فكرة الصيغة، وأشهر الأخطاء، وتمارين قصيرة تكتبها بيدك</div></div></div>
    <p class="sub"><span class="en">Each skill shows the <strong>form</strong> to memorize, the mistakes students make with it, then short exercises you type yourself. Go in order, then move to Programs.</span>
    <span class="ar" dir="rtl" style="display:block">كل مهارة فيها الصيغة اللي تحفظها، والأخطاء الشائعة، وتمارين قصيرة. امشِ بالترتيب وبعدين روح للبرامج.</span></p>
    ${groups.map(g=>`<section class="grp"><div class="grp-h">${esc(g)}</div><div class="grid">${SKILLS.map((s,i)=>({s,i})).filter(o=>o.s.ch===g).map(({s,i})=>{
      const d=skillDone(i), n=s.practice.length;
      return `<button class="tile" data-s="${i}"><span class="chips"><span class="chip ${d===n?'ok':''}">${d} / ${n}</span></span><b>${esc(s.t)}</b><span class="ar" dir="rtl">${esc(s.ar)}</span><span class="meter"><i style="width:${d/n*100}%"></i></span></button>`; }).join("")}</div></section>`).join("")}`;
  $("#main").querySelectorAll("[data-s]").forEach(b=> b.onclick=()=>{ st.skill=+b.dataset.s; render(); scrollTo({top:0}); });
}
function mistakeCards(list){
  return `<div class="mist">${list.map(p=>`<div class="mcard"><div class="row">
    <div class="side bad"><span class="lbl">✗ Wrong · خطأ</span>${code(p.bad)}</div>
    <div class="side good"><span class="lbl">✓ Right · صح</span>${code(p.fix)}</div></div>
    <div class="why"><span class="errname">${esc(p.err)}</span>${bi(p.en,p.ar)}</div></div>`).join("")}</div>`;
}
function skillPage(si){
  const s=SKILLS[si];
  $("#main").innerHTML = `<div class="head"><div><div class="eyebrow">${esc(s.ch)} · skill ${si+1} of ${SKILLS.length}</div><h2>${esc(s.t)}</h2><div class="sub" dir="rtl">${esc(s.ar)}</div></div>
     <button class="btn small" id="back">← All skills · كل المهارات</button></div>
    <h3 class="sec">The form <span class="ar">الصيغة</span></h3>${code(s.form)}
    ${s.table?`<div class="tbl-wrap"><table><tr><th>When</th><th>Write</th><th>Call / use</th><th style="text-align:right">متى</th></tr>${s.table.map(r=>`<tr><td>${esc(r[0])}</td><td><code>${esc(r[1])}</code></td><td><code>${esc(r[2])}</code></td><td class="ar">${esc(r[3])}</td></tr>`).join("")}</table></div>`:""}
    <h3 class="sec">Remember <span class="ar">تذكّر</span></h3>

    <div class="pager">${si>0?`<button class="btn" id="prev">← ${esc(SKILLS[si-1].t)}</button>`:"<span></span>"}${si<SKILLS.length-1?`<button class="btn primary" id="next">${esc(SKILLS[si+1].t)} →</button>`:`<button class="btn primary" id="toprog">Go to Programs →</button>`}</div>`;
  $("#back").onclick=()=>{ st.skill=null; render(); };

const TNAME={write:["Write it","اكتبها"],fix:["Fix it","صحّحها"],fill:["Fill in","أكمل"],order:["Put in order","رتّب"],mcq:["Choose","اختر"]};
function drawItem(el, it, key, idx){
  const sv = store.get(key, {});
  const save=()=>store.set(key, sv);
  el.classList.toggle("done-ok", !!sv.ok);
  let body="";
  if(it.type==="write"||it.type==="fix"){
    body = `<textarea class="code-in" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Your code" placeholder="${it.type==='write'?'Type your code here…':''}">${esc(sv.val!=null? sv.val : (it.type==="fix"? it.start : ""))}</textarea>
      <div class="actions"><button class="btn primary" data-a="check">Check · تحقق</button><button class="btn small" data-a="show">Show answer · الإجابة</button>${it.type==="fix"?'<button class="btn small" data-a="reset">Reset · إعادة</button>':''}</div>`;
  } else if(it.type==="fill"){
    const parts=esc(it.code).split("___");
    body = `<pre class="code"><code>${parts.map((p,i)=> p+(i<parts.length-1?`<input class="blank" spellcheck="false" autocomplete="off" aria-label="Blank ${i+1}" size="${Math.max(5,it.blanks[i].length+1)}" value="${esc((sv.vals||[])[i]||"")}">`:"")).join("")}</code></pre>
      <div class="actions"><button class="btn primary" data-a="check">Check · تحقق</button><button class="btn small" data-a="show">Show answer · الإجابة</button></div>`;
  } else if(it.type==="mcq"){
    const order = sv.order || (sv.order = shuffle(it.options.map((_,i)=>i)));
    body = `<div class="opts">${order.map(o=>`<button class="opt" data-o="${o}"><code style="background:none;padding:0">${esc(it.options[o])}</code></button>`).join("")}</div>`;
  } else if(it.type==="order"){
    body = `<div class="parsons-host"></div>`;
  }
  el.innerHTML = `<div class="chips"><span class="chip">${idx+1} · ${TNAME[it.type][0]} · ${TNAME[it.type][1]}</span>${sv.ok?'<span class="chip ok">Solved · تم</span>':''}</div>
    <p class="q en">${inl(it.q)}</p><p class="qa ar" dir="rtl">${inl(it.qa||"")}</p>${body}<div class="fbhost"></div>`;
  const fb=(ok, extra)=>{ el.querySelector(".fbhost").innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="v">${ok?"Correct · صحيح":"Not yet · مو بعد"}</span>${extra||""}${bi(it.en,it.ar)}</div>`; };
  const mark=(ok)=>{ if(ok){ sv.ok=true; el.classList.add("done-ok"); } save(); };
  if(it.type==="write"||it.type==="fix"){
    const ta=el.querySelector("textarea"); smart(ta);
    ta.oninput=()=>{ sv.val=ta.value; save(); };
    const answerBox = ()=> `<div><strong>Model answer · الإجابة النموذجية</strong>${code(it.accept[0])}${it.accept.length>1||it.re?'<span class="sub en">Other correct forms are also accepted.</span>':''}</div>`;
    el.querySelector('[data-a="check"]').onclick=()=>{ const ok=matches(it, ta.value); mark(ok);
      fb(ok, ok? "" : answerBox() + `<div class="actions" style="margin-top:0"><button class="btn small" data-a="mine">Mine is also correct · إجابتي صحيحة</button></div>`);
      const m=el.querySelector('[data-a="mine"]'); if(m) m.onclick=()=>{ mark(true); fb(true); }; };
    el.querySelector('[data-a="show"]').onclick=()=>{ el.querySelector(".fbhost").innerHTML = `<div class="fb">${answerBox()}${bi(it.en,it.ar)}</div>`; };
    const r=el.querySelector('[data-a="reset"]'); if(r) r.onclick=()=>{ sv.val=it.start; save(); drawItem(el,it,key,idx); };
  }
  if(it.type==="fill"){
    const ins=[...el.querySelectorAll("input.blank")];
    ins.forEach(x=> x.oninput=()=>{ sv.vals=ins.map(y=>y.value); save(); });
    el.querySelector('[data-a="check"]').onclick=()=>{ const res=it.blanks.map((b,i)=> norm(ins[i].value)===norm(b)); ins.forEach((x,i)=>{ x.classList.toggle("right",res[i]); x.classList.toggle("wrong",!res[i]); });
      const ok=res.every(Boolean); mark(ok); fb(ok, ok?"":`<div>Answers: ${it.blanks.map(b=>`<code>${esc(b)}</code>`).join(" · ")}</div>`); };
    el.querySelector('[data-a="show"]').onclick=()=>{ ins.forEach((x,i)=>{ x.value=it.blanks[i]; }); sv.vals=it.blanks.slice(); save(); };
  }
  if(it.type==="mcq"){
    const bs=el.querySelectorAll(".opt");
    const paint=()=> bs.forEach(b=>{ const o=+b.dataset.o; b.disabled=true; if(o===it.answer) b.classList.add("right"); else if(o===sv.pick) b.classList.add("wrong"); });
    if(sv.pick!=null){ paint(); fb(sv.pick===it.answer); }
    else bs.forEach(b=> b.onclick=()=>{ sv.pick=+b.dataset.o; const ok=sv.pick===it.answer; mark(ok); paint(); fb(ok); });
  }
  if(it.type==="order"){
    parsons(el.querySelector(".parsons-host"), it.lines, sv, save, ok=>{ mark(ok); fb(ok); });
  }
}
/* Parsons: tap lines from the pool to build the program */
function parsons(host, lines, sv, save, onCheck){
  if(!sv.pool){ sv.pool = shuffle(lines.map((_,i)=>i)); sv.ans=[]; }
  const draw=(checked)=>{
    host.innerHTML = `<div class="parsons">
      <div class="pane"><div class="pane-h">Your program · برنامجك (tap a line to remove)</div><div class="plist" id="ans">${sv.ans.length? sv.ans.map((li,k)=>`<button class="pline ${checked? (lines[li]===lines[k]?'right':'wrong'):''}" data-k="${k}">${hl(lines[li])||" "}</button>`).join("") : '<div class="empty">Tap lines on the right, in order. · اضغط الأسطر بالترتيب</div>'}</div></div>
      <div class="pane"><div class="pane-h">Lines · الأسطر (${sv.pool.length} left)</div><div class="plist" id="pool">${sv.pool.length? sv.pool.map((li,k)=>`<button class="pline" data-p="${k}">${hl(lines[li])||" "}</button>`).join("") : '<div class="empty">All lines used. · خلّصت الأسطر</div>'}</div></div></div>
      <div class="actions"><button class="btn primary" data-a="pcheck" ${sv.pool.length?'disabled':''}>Check order · تحقق</button><button class="btn small" data-a="preset">Start over · من جديد</button><button class="btn small" data-a="pshow">Show answer · الإجابة</button></div>`;
    host.querySelectorAll("[data-p]").forEach(b=> b.onclick=()=>{ sv.ans.push(sv.pool.splice(+b.dataset.p,1)[0]); save(); draw(); });
    host.querySelectorAll("[data-k]").forEach(b=> b.onclick=()=>{ sv.pool.push(sv.ans.splice(+b.dataset.k,1)[0]); save(); draw(); });
    host.querySelector('[data-a="pcheck"]').onclick=()=>{ const ok = sv.ans.every((li,k)=> lines[li]===lines[k]); draw(true); onCheck(ok); };
    host.querySelector('[data-a="preset"]').onclick=()=>{ sv.pool=shuffle(lines.map((_,i)=>i)); sv.ans=[]; save(); draw(); };
    host.querySelector('[data-a="pshow"]').onclick=()=>{ sv.ans=lines.map((_,i)=>i); sv.pool=[]; save(); draw(true); };
  };
  draw();
}

function progPage(pi){

  $("#main").innerHTML = `<div class="head"><div><div class="eyebrow">${LVL[p.lvl][0]} · program ${pi+1} of ${PROGRAMS.length}</div><h2>${esc(p.t)}</h2><div class="sub" dir="rtl">${esc(p.ar)}</div></div>
     <button class="btn small" id="back">← All programs · كل البرامج</button></div>
    <div class="card"><p class="task en" style="margin-top:0">${inl(p.task)}</p><p class="ar-block ar" dir="rtl" style="margin:0">${inl(p.arTask)}</p>
      <div class="io">${p.input?`<div><div class="pane-h">Input typed by the user · المدخلات</div><pre class="code"><code>${esc(p.input.replace(/\n$/,""))}</code></pre></div>`:""}
      <div><div class="pane-h">Expected output · الناتج المتوقع</div><pre class="code"><code>${esc(p.output)}</code></pre></div></div></div>
    <details class="help" id="help" ${sv.helpOpen?'open':''}><summary>Help · مساعدة <span class="sub" style="font-weight:500;font-family:var(--body)">hints, forms, steps</span></summary><div class="help-body">
      <div><div class="pane-h">Program flow, one hint at a time · تسلسل البرنامج</div><ol class="hint-list" id="hints"></ol><div class="actions" id="hintbtn"></div></div>
      <div><div class="pane-h">Forms you'll need · الصيغ اللي تحتاجها</div>${p.forms.map(id=>{ const s=SKILLS.find(x=>x.id===id); return `<details class="formbox"><summary>${esc(s.t)} · <span dir="rtl">${esc(s.ar)}</span></summary>${code(s.form)}</details>`; }).join("")}</div>
      <div><div class="pane-h">Watch out · انتبه</div><ul class="hint-list">${p.mistakes.map(m=>`<li>${bi(m[0],m[1])}</li>`).join("")}</ul></div>
      <div><div class="pane-h">Steps for any program · خطوات أي برنامج</div><ol class="hint-list">${STEPS.map(s=>`<li>${bi(s[0],s[1])}</li>`).join("")}</ol></div>
    </div></details>
    <div class="seg" role="group" aria-label="Mode" style="margin-top:16px"><button data-m="write" aria-pressed="${sv.mode!=='arrange'}">Write it · اكتب</button><button data-m="arrange" aria-pressed="${sv.mode==='arrange'}">Arrange mode (easier) · رتّب</button></div>
    <div id="work" style="margin-top:10px"></div>
    <div id="modelhost"></div>
    <div class="pager">${pi>0?`<button class="btn" id="prev">← ${esc(PROGRAMS[pi-1].t)}</button>`:"<span></span>"}${pi<PROGRAMS.length-1?`<button class="btn primary" id="next">${esc(PROGRAMS[pi+1].t)} →</button>`:"<span></span>"}</div>`;
  $("#back").onclick=()=>{ st.prog=null; render(); };
  const pv=$("#prev"); if(pv) pv.onclick=()=>{ st.prog=pi-1; render(); scrollTo({top:0}); };
  const nx=$("#next"); if(nx) nx.onclick=()=>{ st.prog=pi+1; render(); scrollTo({top:0}); };
  $("#help").addEventListener("toggle", e=>{ sv.helpOpen=e.target.open; save(); });
  const drawHints=()=>{
    $("#hints").innerHTML = p.hints.slice(0,sv.hints).map((h,k)=>`<li>${bi(h,p.arHints[k])}</li>`).join("") || `<li style="list-style:none;margin-left:-1.4em" class="sub">${bi("No hints shown yet.","ما فيه تلميحات بعد.")}</li>`;
    $("#hintbtn").innerHTML = sv.hints<p.hints.length? `<button class="btn small" id="morehint">Next hint (${sv.hints+1}/${p.hints.length}) · التلميح التالي</button>` : "";
    const mh=$("#morehint"); if(mh) mh.onclick=()=>{ sv.hints++; save(); drawHints(); };
  };
  drawHints();
  const drawModel=()=>{
    $("#modelhost").innerHTML = !sv.revealed ? `<div class="actions"><button class="btn" id="reveal">Show model answer · الحل النموذجي</button></div>` :
      `<h3 class="sec">Model answer <span class="ar">الحل النموذجي</span></h3>${code(p.model)}
       <div class="actions"><span class="sub">How did you do? · قيّم نفسك</span><button class="btn small" data-s="1" aria-pressed="${sv.score===1}">Got it · صح</button><button class="btn small" data-s="0.5">Partly · جزئي</button><button class="btn small" data-s="0">Missed · غلط</button>
       ${sv.score!=null?`<span class="chip ${sv.score===1?'ok':sv.score>0?'warn':''}">${sv.score===1?"Got it":sv.score>0?"Partly":"Missed"}</span>`:""}</div>`;
    const r=$("#reveal"); if(r) r.onclick=()=>{ sv.revealed=true; save(); drawModel(); };
    $("#modelhost").querySelectorAll("[data-s]").forEach(b=> b.onclick=()=>{ sv.score=+b.dataset.s; save(); drawModel(); });
  };
  const drawWork=()=>{
    if(sv.mode==="arrange"){
      sv.parsons = sv.parsons || {};
      $("#work").innerHTML = `<p class="sub" style="margin:0 0 8px">${bi("Build the program from its lines. Some lines (like the order of two functions or two fields) could swap in real Rust; here they are checked against the model.","كوّن البرنامج من أسطره. بعض الأسطر ممكن تتبدل في Rust الحقيقي (مثل ترتيب دالتين)، بس هنا تتقارن مع الحل النموذجي.")}</p><div id="phost"></div><div class="fbhost"></div>`;
      parsons($("#phost"), lines, sv.parsons, save, ok=>{ $("#work .fbhost").innerHTML = `<div class="fb ${ok?'ok':'no'}"><span class="v">${ok?"Correct order · ترتيب صحيح":"Some lines are out of place · فيه أسطر مو بمكانها"}</span></div>`; });
    } else {
      $("#work").innerHTML = `<textarea class="code-in" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Your program" style="min-height:300px" placeholder="fn main() {\n    \n}">${esc(sv.code||"")}</textarea>
        <p class="sub" style="margin:6px 0 0;font-size:.85rem">${bi("Tab adds 4 spaces; Enter keeps the indentation. Compare with the expected output and the model answer.","Tab يضيف 4 مسافات، و Enter يحافظ على المسافة البادئة.")}</p>`;
      const ed=$("#ed"); smart(ed); ed.oninput=()=>{ sv.code=ed.value; save(); };
    }
  };
  $("#main").querySelectorAll("[data-m]").forEach(b=> b.onclick=()=>{ sv.mode=b.dataset.m; save(); $("#main").querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.m===(sv.mode==="arrange"?"arrange":"write"))); drawWork(); });
  drawWork(); drawModel();
}

/* ---------- Mistakes ---------- */
function mistakesPage(){
  $("#main").innerHTML = `<div class="head"><div><div class="eyebrow">${SKILLS.reduce((a,s)=>a+s.pitfalls.length,0)} mistakes · grouped by skill</div><h2>Mistakes to avoid while writing</h2>
    <div class="sub ar" dir="rtl">الأخطاء اللي ممكن تقع فيها وأنت تكتب، مع اسم الخطأ والتصحيح</div></div>
    <input class="search" id="q" type="search" placeholder="Search: mut, &mut, struct, moved…" aria-label="Search mistakes"></div><div id="ml"></div>`;
  const draw=(f)=>{ const t=(f||"").toLowerCase();
    $("#ml").innerHTML = SKILLS.map(s=>{ const list=s.pitfalls.filter(p=>!t || (p.bad+p.fix+p.err+p.en+p.ar+s.t).toLowerCase().includes(t)); return list.length? `<h3 class="sec">${esc(s.t)} <span class="ar">${esc(s.ar)}</span></h3>${mistakeCards(list)}`:""; }).join("") || `<p class="sub">No match.</p>`; };
  $("#q").oninput=e=>draw(e.target.value); draw();
}

/* ---------- How to write ---------- */
function howtoPage(){
  const T=(rows,h)=>`<div class="tbl-wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}<th style="text-align:right">بالعربي</th></tr>${rows.map(r=>`<tr>${r.slice(0,-1).map((c,i)=>`<td>${i?`<code>${esc(c)}</code>`:esc(c)}</td>`).join("")}<td class="ar">${esc(r[r.length-1])}</td></tr>`).join("")}</table></div>`;
  $("#main").innerHTML = `<div class="head"><div><div class="eyebrow">Read once, then use while writing</div><h2>How to write a Rust program in the exam</h2>
    <div class="sub ar" dir="rtl">خطوات كتابة أي برنامج، وجداول تساعدك تختار الصيغة الصح</div></div></div>
    <ol class="steps">${STEPS.map(s=>`<li>${bi(s[0],s[1])}</li>`).join("")}</ol>
    <h3 class="sec">Which data shape? <span class="ar">أي شكل للبيانات؟</span></h3>
    ${T([["Values with names (a person, a product)","struct P { name: String, age: u32 }","قيم لها أسماء"],["2–3 values, maybe of different types","(i32, f64)","قيمتين أو ثلاث"],["Many values of one type, fixed count","[i32; 5]","قيم كثيرة من نوع واحد"],["A function must give back 2+ values","-> (u32, f64)","إرجاع أكثر من قيمة"],["Text you build or change","String","نص تبنيه أو تعدله"],["Text you only read","&str","نص للقراءة"]],["Situation","Use"])}
    <h3 class="sec">How to send it to a function <span class="ar">كيف ترسلها للدالة</span></h3>
    ${T([["Read only","p: &T  →  f(&x)","قراءة"],["Change it","p: &mut T  →  f(&mut x), let mut x","تعديل"],["Give it away","p: T  →  f(x)  (x moved)","تسليم الملكية"],["Numbers, bool, char","p: i32  →  f(x)  (copied)","أنواع تنسخ"],["Array of any length","p: &[i32]  →  f(&a)","مصفوفة بأي طول"]],["Need","Parameter → call"])}
    <h3 class="sec">Which loop? <span class="ar">أي حلقة؟</span></h3>
    ${T([["Every element of an array","for x in a { }","كل عنصر"],["A counted range","for i in 1..=n { }","عدد معروف"],["While a condition holds","while n > 0 { n -= 1; }","طالما الشرط صحيح"],["Until something happens / need a result","let r = loop { break v; };","لين يصير شي"],["Ask the user until valid input","loop { … Err(_) => continue … break; }","لين يدخل إدخال صحيح"]],["Task","Loop"])}
    <h3 class="sec">Which self? <span class="ar">أي self؟</span></h3>
    ${T([["Method reads fields","fn area(&self) -> u32","قراءة"],["Method changes fields","fn grow(&mut self)  +  let mut r","تعديل"],["Constructor / helper with no instance","fn new(..) -> Self  →  Type::new(..)","إنشاء"]],["Method","Signature"])}
    <h3 class="sec">Last check before you hand in <span class="ar">مراجعة أخيرة</span></h3>
    <div class="card pairs">${[["Every `{` has its `}`; struct fields end with `,`.","كل `{` لها `}`، وحقول الـ struct تنتهي بـ `,`."],["`mut` on every variable you change, `&mut` on both sides.","`mut` لكل متغير يتغير، و `&mut` في الطرفين."],["The returned value has no `;`; the return type is after `->`.","القيمة المرجعة بدون `;` ونوعها بعد `->`."],["No int + float mixing: write `2.0`, or use `as f64`.","لا تخلط صحيح مع عشري: اكتب `2.0` أو `as f64`."],["Strings in structs: `String::from(\"..\")`.","النصوص في الـ struct: `String::from(\"..\")`."],["Printing a struct: `#[derive(Debug)]` + `{:?}`.","طباعة struct: `#[derive(Debug)]` مع `{:?}`."],["Output format matches the question exactly (spaces, commas).","شكل الطباعة نفس المطلوب بالضبط."]].map(p=>`<div class="pair"><div class="en">${inl(p[0])}</div><div class="ar" dir="rtl">${inl(p[1])}</div></div>`).join("")}</div>`;
}

render();
})();
</script>

</body></html>
